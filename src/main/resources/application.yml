spring:
    application:
        name: jobflow-backend
    profiles:
        active: local
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: false
        open-in-view: false
    flyway:
        enabled: true
        clean-disabled: true
        validate-on-migrate: false

server:
    address: 0.0.0.0
    port: ${PORT:8081}



jobflow:
    cors:
        allowed-origins: http://localhost:3000
    jwt:
        secret: aa9e7c2ea009f09a17818fa59509c75dabd1572baf5a530b8790ce4430a00fbe
        access-token-expiration-ms: 900000
        refresh-token-expiration-ms: 604800000
    ai:
        provider-url: http://localhost:11434
        model: mistral
    oauth:
        frontend-redirect-url: ${JOBFLOW_OAUTH_REDIRECT_URL:http://localhost:3000/oauth-callback}