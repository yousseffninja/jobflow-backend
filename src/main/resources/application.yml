spring:
    application:
        name: jobflow-backend
    profiles:
        active: local
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: false
        open-in-view: false
    flyway:
        enabled: true
        clean-disabled: true

server:
    port: 8081

jobflow:
    cors:
        allowed-origins: http://localhost:3000